# Builds the ComfyUI-Vault Docker image and pushes it to GitHub's container registry:
#   ghcr.io/<your GitHub user>/vast-comfyui:latest   (and a dated tag, e.g. :2026-11-25)
#
# Runs when you change anything in docker/, every Monday (picks up new ComfyUI + base image),
# or by hand: GitHub repo -> Actions -> "Build Docker image" -> Run workflow.
# A build takes roughly 40-90 minutes (mostly compiling SageAttention).
name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/build-image.yml"]
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space (the base image is ~30 GB unpacked)
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h / /mnt || true

      - name: Put Docker's storage on the biggest disk
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            echo "Using /mnt for Docker ($((mnt_free/1048576)) GB free)"
            sudo systemctl stop docker docker.socket || true
            sudo mkdir -p /mnt/docker
            cfg=/etc/docker/daemon.json
            [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' "$cfg" | sudo tee "$cfg.new" >/dev/null
            sudo mv "$cfg.new" "$cfg"
            sudo systemctl start docker
          else
            echo "Using / for Docker ($((root_free/1048576)) GB free)"
          fi
          docker info --format 'Docker root: {{.DockerRootDir}}'

      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/vast-comfyui" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          pull: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ComfyUI + JupyterLab for Vast.ai with an R2 vault
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}

      - name: Done
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }}:latest"
          docker image inspect "${{ steps.meta.outputs.image }}:latest" --format 'Size: {{.Size}} bytes' || true
          df -h / /mnt || true
